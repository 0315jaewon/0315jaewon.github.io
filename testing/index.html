<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
</head>
<body>
    <h1>Add to the To-Do List</h1>
    <p>Tasks are saved in this browser on this device.</p>
    <form id="task-form">
        <input type="text" name="task" placeholder="Enter a task" aria-label="Task" required>
        <button type="submit" disabled>Add Task</button>
    </form>
    <h2>Saved Tasks:</h2>
    <pre id="tasks" aria-live="polite"></pre>
    <p id="status" role="status"></p>
    <script src="tasks.js"></script>
</body>
</html>
